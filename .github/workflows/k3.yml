name: K3 checks
on:
  push:
    branches: [feature/k3]
  pull_request:
    paths: ['k3/**', 'ui_xml/portrait/**', 'ui_xml/components/panel_widget_k3_dashboard.xml', 'assets/config/themes/defaults/k3-violet.json', 'src/ui/**', 'include/ui_panel_motion.h']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s k3 -p 'test_*.py' -v
